# SonarQube Cloud automatic analysis reads this file (not sonar-project.properties), and its
# values take precedence over Administration > Analysis Scope in the UI.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/

# Generated code, never edited by hand:
# - EF Core migrations, from `dotnet ef migrations add`
# - Angular service proxies, from `abp generate-proxy` (angular/src/app/proxy and each
#   module library's src/lib/proxy)
sonar.exclusions=**/Migrations/**,**/proxy/**
