# SonarQube Cloud automatic analysis reads this file (not sonar-project.properties), and its
# values take precedence over Administration > Analysis Scope in the UI.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/

# Generated code, never edited by hand:
# - EF Core migrations, from `dotnet ef migrations add`
# - Angular service proxies, from `abp generate-proxy` (angular/src/app/proxy and each
#   module library's src/lib/proxy)
# - angular/scripts/: the ABP template's symlink tooling, unmodified since the scaffold
#   and deliberately inert here ($PackageDirectories is empty). `project/angular-workspaces.md`
#   explains why this repo must not use it: both scripts are destructive and not reversible
#   without a reinstall, and registering a module there makes `ng build <lib>` fail silently.
#   Refactoring it for cognitive complexity (S3776) would mean editing destructive code that
#   nothing runs, so it is excluded rather than rewritten.
sonar.exclusions=**/Migrations/**,**/proxy/**,angular/scripts/**
