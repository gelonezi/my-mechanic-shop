name: mymechanicshop-containers

services:
  postgresql:
    image: postgres:18
    container_name: mymechanicshop-postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres 18+ keeps PGDATA under /var/lib/postgresql/<major>/docker, so mount the parent.
      - postgresql-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgresql-data:
    name: mymechanicshop-postgresql-data
