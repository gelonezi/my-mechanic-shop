apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        # Outside Development the API does not migrate: the DbMigrator migrates and seeds every
        # database before each API pod starts (idempotent, a few seconds when nothing changed)
        - name: dbmigrator
          image: rogeriogelonezi/mymechanicshop-dbmigrator:latest
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mymechanicshop
                  key: postgres-password
            - name: ConnectionStrings__Default
              value: Host=postgresql;Port=5432;Database=MyMechanicShop;User ID=postgres;Password=$(POSTGRES_PASSWORD);
            - name: ConnectionStrings__Catalog
              value: Host=postgresql;Port=5432;Database=MyMechanicShopCatalog;User ID=postgres;Password=$(POSTGRES_PASSWORD);
            # Seeds the host admin on a new database instead of ABP's documented default password
            - name: App__AdminPassword
              valueFrom:
                secretKeyRef:
                  name: mymechanicshop-admin
                  key: password
            - name: OpenIddict__Applications__MyMechanicShop_App__RootUrl
              value: https://mymechanicshop.gelonezi.com
            - name: OpenIddict__Applications__MyMechanicShop_Swagger__RootUrl
              value: https://mymechanicshop-api.gelonezi.com/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: rogeriogelonezi/mymechanicshop-api:latest
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mymechanicshop
                  key: postgres-password
            - name: ConnectionStrings__Default
              value: Host=postgresql;Port=5432;Database=MyMechanicShop;User ID=postgres;Password=$(POSTGRES_PASSWORD);
            - name: ConnectionStrings__Catalog
              value: Host=postgresql;Port=5432;Database=MyMechanicShopCatalog;User ID=postgres;Password=$(POSTGRES_PASSWORD);
            - name: App__SelfUrl
              value: https://mymechanicshop-api.gelonezi.com
            - name: App__AngularUrl
              value: https://mymechanicshop.gelonezi.com
            - name: App__CorsOrigins
              value: https://mymechanicshop.gelonezi.com
            - name: App__RedirectAllowedUrls
              value: https://mymechanicshop.gelonezi.com
            - name: App__DisablePII
              value: "true"
            - name: AuthServer__Authority
              value: https://mymechanicshop-api.gelonezi.com
            # TLS ends at Cloudflare: the host's existing proxy path (forwarded headers on,
            # OpenIddict's own HTTPS check off)
            - name: AuthServer__RequireHttpsMetadata
              value: "false"
            - name: AuthServer__CertificatePassPhrase
              valueFrom:
                secretKeyRef:
                  name: mymechanicshop
                  key: openiddict-passphrase
            - name: StringEncryption__DefaultPassPhrase
              valueFrom:
                secretKeyRef:
                  name: mymechanicshop
                  key: string-encryption-passphrase
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health-status
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The OpenIddict signing and encryption certificate, read from /app/openiddict.pfx
            - name: openiddict-certificate
              mountPath: /app/openiddict.pfx
              subPath: openiddict.pfx
              readOnly: true
            # ASP.NET Core's default key ring ($HOME/.aspnet): keeps logins valid across restarts
            - name: data-protection
              mountPath: /home/app/.aspnet/DataProtection-Keys
      volumes:
        - name: openiddict-certificate
          secret:
            secretName: openiddict-certificate
        - name: data-protection
          persistentVolumeClaim:
            claimName: api-data-protection
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-data-protection
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
