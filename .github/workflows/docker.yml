name: Docker images

# Pull requests only build, so a broken Dockerfile fails before merging; main also pushes
# rogeriogelonezi/mymechanicshop-<image> to Docker Hub as :latest and :<commit sha>,
# then deploys that commit to the home server's k3s (etc/k8s).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: src/MyMechanicShop.HttpApi.Host/Dockerfile
          - image: dbmigrator
            dockerfile: src/MyMechanicShop.DbMigrator/Dockerfile
          - image: angular
            dockerfile: angular/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Third-party actions that see the Docker Hub token are pinned to a commit
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            rogeriogelonezi/mymechanicshop-${{ matrix.image }}:latest
            rogeriogelonezi/mymechanicshop-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy (home server)
    needs: image
    if: github.event_name != 'pull_request'
    # The self-hosted runner on the home server; its kubeconfig is the namespace-scoped
    # deployer ServiceAccount (etc/k8s/cluster/deployer.yaml)
    runs-on: [self-hosted, mymechanicshop]
    concurrency: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin every image to this commit, so a rollout is reproducible and :latest never drifts
      - name: Apply
        run: |
          kubectl kustomize etc/k8s \
            | sed -E "s#(mymechanicshop-(api|dbmigrator|angular)):latest#\1:${GITHUB_SHA}#" \
            | kubectl apply -f -

      # The API pod migrates in its init container before it starts
      - name: Wait for the rollout
        run: |
          kubectl -n mymechanicshop rollout status deployment/api --timeout=10m
          kubectl -n mymechanicshop rollout status deployment/angular --timeout=5m
