<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">{{ 'Catalog::Menu:Products' | abpLocalization }}</h5>
      </div>
      <div class="text-end col col-md-6">
        <button id="create" class="btn btn-primary" type="button" (click)="createProduct()">
          <i class="fa fa-plus me-1"></i>
          <span>{{ 'Catalog::NewProduct' | abpLocalization }}</span>
        </button>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="products().items" [count]="products().totalCount" [list]="list" default>
      <ngx-datatable-column [name]="'Catalog::Name' | abpLocalization" prop="name" />
      <ngx-datatable-column [name]="'Catalog::Brand' | abpLocalization" prop="brand" />
      <ngx-datatable-column [name]="'Catalog::Ean' | abpLocalization" prop="ean" />
      <ngx-datatable-column [name]="'Catalog::Unit' | abpLocalization" prop="unit">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ 'SharedKernel::Enum:ProductUnit.' + row.unit | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>

      <!-- Actions last so the buttons sit on the right-hand edge of the row.
           sortable=false because there is nothing to sort by, and a fixed width keeps
           the buttons from stretching as the table resizes. -->
      <ngx-datatable-column
        [name]="'Catalog::Actions' | abpLocalization"
        [maxWidth]="150"
        [width]="150"
        [sortable]="false"
      >
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div class="d-flex gap-2 justify-content-end">
            <button
              type="button"
              class="btn btn-sm btn-outline-primary"
              [title]="'AbpUi::Edit' | abpLocalization"
              (click)="editProduct(row.id)"
            >
              <i class="fa fa-pen" aria-hidden="true"></i>
              <span class="visually-hidden">{{ 'AbpUi::Edit' | abpLocalization }}</span>
            </button>
            <button
              type="button"
              class="btn btn-sm btn-outline-danger"
              [title]="'AbpUi::Delete' | abpLocalization"
              (click)="deleteProduct(row)"
            >
              <i class="fa fa-trash" aria-hidden="true"></i>
              <span class="visually-hidden">{{ 'AbpUi::Delete' | abpLocalization }}</span>
            </button>
          </div>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>
      {{ (selectedProductId() ? 'AbpUi::Edit' : 'Catalog::NewProduct') | abpLocalization }}
    </h3>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="mt-2">
        <label class="form-label" for="product-name">{{ 'Catalog::Name' | abpLocalization }}</label>
        <input type="text" id="product-name" class="form-control" formControlName="name" ngbAutofocus />
      </div>

      <div class="mt-2">
        <label class="form-label" for="product-brand">{{ 'Catalog::Brand' | abpLocalization }}</label>
        <input type="text" id="product-brand" class="form-control" formControlName="brand" />
      </div>

      <div class="mt-2">
        <label class="form-label" for="product-ean">{{ 'Catalog::Ean' | abpLocalization }}</label>
        <input type="text" id="product-ean" class="form-control" formControlName="ean" inputmode="numeric" />
      </div>

      <div class="mt-2">
        <label class="form-label" for="product-unit">{{ 'Catalog::Unit' | abpLocalization }}</label>
        <!-- [ngValue], not value: value would hand the form a string ("1"), and the API
             expects the enum's number. The disabled placeholder is ProductUnit.Undefined (0),
             which Validators.min keeps invalid until a real unit is picked. -->
        <select id="product-unit" class="form-select" formControlName="unit">
          <option [ngValue]="0" disabled>-</option>
          @for (option of unitOptions; track option.value) {
            <option [ngValue]="option.value">
              {{ 'SharedKernel::Enum:ProductUnit.' + option.value | abpLocalization }}
            </option>
          }
        </select>
      </div>

      <div class="mt-2">
        <label class="form-label" for="product-description">{{ 'Catalog::Description' | abpLocalization }}</label>
        <textarea id="product-description" class="form-control" rows="3" formControlName="description"></textarea>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>
      {{ 'AbpUi::Cancel' | abpLocalization }}
    </button>
    <button class="btn btn-primary" type="button" (click)="save()" [disabled]="form.invalid">
      {{ 'AbpUi::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
